<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10131b">
<title>翻刀切铅笔 · AI Game Jam</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e28;--line:#2c3341;--lime:#d9ff68;--muted:#9aa6b9;--text:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100svh}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header{max-width:1100px;margin:0 auto;padding:24px 28px;display:flex;align-items:center;justify-content:space-between}a{color:var(--muted);text-decoration:none;font-size:13px}a:hover{color:var(--lime)}.brand{font-size:12px;letter-spacing:2px;color:var(--lime)}main{max-width:1000px;margin:0 auto;padding:6px 28px 28px;display:grid;grid-template-columns:minmax(240px,1fr) minmax(300px,430px);gap:64px;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--lime);margin:0 0 20px}.title{font-size:clamp(34px,4.5vw,62px);letter-spacing:-2px;line-height:1.06;margin:0 0 22px}.subtitle{color:var(--muted);font-size:15px;line-height:1.85;max-width:330px}.tags{display:flex;gap:8px;margin:26px 0}.tag{padding:7px 10px;border:1px solid var(--line);border-radius:30px;font-size:11px;color:#bcc7d8}.how{margin-top:38px;border-top:1px solid var(--line);padding-top:24px;max-width:340px}.how p{font-size:13px;color:var(--muted);line-height:1.9;margin:10px 0}.how b{font-size:11px;color:var(--lime);margin-right:12px}.key{display:inline-flex;align-items:center;justify-content:center;border:1px solid #414a5d;min-width:34px;padding:1px 7px;border-radius:5px;font-size:11px;color:#e5eaf4}.game-shell{width:100%;border:1px solid var(--line);border-radius:22px;background:#161b25;overflow:hidden;box-shadow:0 24px 75px #0004}.hud{display:flex;padding:18px 20px 14px;align-items:center;gap:26px;border-bottom:1px solid #ffffff09}.metric small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;margin-bottom:5px}.metric strong{font-size:25px;font-weight:650;line-height:1}.metric:first-child strong{color:var(--lime)}.controls{display:flex;gap:6px;margin-left:auto}.icon{border:1px solid var(--line);border-radius:9px;background:transparent;color:#d6ddeb;width:34px;height:34px;font-size:15px}.icon:hover{border-color:var(--lime)}.icon:disabled{opacity:.4;cursor:default}.stage{position:relative;aspect-ratio:420/560;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#10131bc9;padding:25px;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.card{text-align:center;width:100%;padding:20px 10px}.card .mark{display:block;color:var(--lime);font-size:11px;letter-spacing:3px;margin-bottom:18px}.card h2{font-size:31px;margin:8px 0 14px;letter-spacing:-1px}.card p{color:#b5bfd0;font-size:13px;line-height:1.9;margin:12px auto 25px;max-width:280px}.primary{border:0;background:var(--lime);color:#151a17;border-radius:11px;font-weight:700;font-size:14px;padding:15px 34px;min-width:190px;box-shadow:0 5px 25px #d9ff6815}.primary:hover{background:#e3ff94}.game-footer{padding:13px 18px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);border-top:1px solid #ffffff09}.game-footer span:last-child{color:#c4cedf}.result-stat{font-size:54px;color:var(--lime);font-weight:700;letter-spacing:-3px;margin:0 0 5px}.result-stat:empty{display:none}.toast{position:absolute;top:72px;left:0;right:0;text-align:center;color:var(--lime);font-size:19px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s}.toast.show{opacity:1}.mobile-tip{display:none}@media(max-width:720px){header{padding:17px 20px}.brand{font-size:10px}main{display:flex;flex-direction:column;padding:0 16px 20px;gap:20px}.intro{width:100%;max-width:430px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap}.eyebrow{margin:6px 0 10px;font-size:9px;width:100%}.title{font-size:31px;letter-spacing:-1px;margin:0}.subtitle{font-size:12px;margin:8px 0 0;max-width:none;width:100%;line-height:1.7}.tags,.how{display:none}.game-shell{max-width:430px;border-radius:17px}.hud{padding:13px 17px}.metric strong{font-size:22px}.stage{aspect-ratio:420/520}.game-footer{padding:11px 16px}.desktop-tip{display:none}.mobile-tip{display:inline}}@media(max-height:800px) and (min-width:721px){main{max-width:930px;grid-template-columns:1fr 370px}.stage{aspect-ratio:420/540}header{padding-top:17px;padding-bottom:17px}}
</style>
</head>
<body>
<header><a href="../../index.html">← 返回试玩大厅</a><span class="brand">AI GAME JAM / 03</span></header>
<main>
<section class="intro"><p class="eyebrow">TIMING × SATISFACTION</p><h1 class="title">翻刀切铅笔</h1><p class="subtitle">看准落点，一刀两断。<br>每一次漂亮的切割，都让你想再来一次。</p><div class="tags"><span class="tag">单指操作</span><span class="tag">时机挑战</span><span class="tag">无限连切</span></div><div class="how"><p><b>01</b>刀会自动前进，虚线圆点预告跳跃落点。</p><p><b>02</b>落点进入铅笔范围，点击或按 <span class="key">空格</span> 翻刀。</p><p><b>03</b>正中细线获得 PERFECT，连续命中提升得分。</p><p style="margin-top:20px;font-size:11px">按 <span class="key">P</span> 暂停 · 按 <span class="key">R</span> 重开</p></div></section>
<section class="game-shell" aria-label="翻刀切铅笔游戏">
<div class="hud"><div class="metric"><small>得分</small><strong id="score">0</strong></div><div class="metric"><small>纪录</small><strong id="best">0</strong></div><div class="controls"><button class="icon" id="sound" aria-label="关闭音效" title="切换音效">♪</button><button class="icon" id="pause" aria-label="暂停" title="暂停 P" disabled>Ⅱ</button><button class="icon" id="restart" aria-label="重新开始" title="重开 R">↻</button></div></div>
<div class="stage" id="stage"><canvas id="game" width="840" height="1120" aria-label="点击画面或按空格翻刀。让预测落点进入铅笔再起跳。"></canvas><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="card"><span class="mark" id="overlayMark">ONE TAP. CLEAN CUT.</span><h2 id="overlayTitle">一刀，刚刚好。</h2><div class="result-stat" id="result"></div><p id="overlayText">刀会自动前进。<br>让虚线落点对准铅笔，再点击翻刀。<br>中间那条细线，是你的满分目标。</p><button class="primary" id="start">开始切割 →</button></div></div></div>
<div class="game-footer"><span id="status">准备就绪</span><span><span class="desktop-tip">点击 / 空格翻刀</span><span class="mobile-tip">轻触画面翻刀</span></span></div>
</section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=420,H=560,FLOOR=415,FLIGHT=.72;
let best=0;try{best=+(localStorage.getItem('jam-knife-best-v1')||0)}catch{}$('best').textContent=best;
let state='ready',score=0,cuts=0,combo=0,speed=100,x=70,camera=0,jump=null,pencils=[],debris=[],sparks=[],labels=[],elapsed=0,shake=0,flash=0,toastTimer=0,last=0,soundOn=true,audio=null,justCut=0;
const colors=['#d9ff68','#ffad79','#a6a1ff','#68dfd2','#ff86b0'];
function tone(freq,duration,type='sine',gain=.05,slide=0){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,t);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(25,freq+slide),t+duration);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(g);g.connect(audio.destination);osc.start(t);osc.stop(t+duration)}catch{}}
function ensureAudio(){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
function reset(){score=0;cuts=0;combo=0;speed=100;x=70;camera=0;jump=null;debris=[];sparks=[];labels=[];elapsed=0;shake=0;flash=0;justCut=0;pencils=[{x:220,w:76,color:colors[0],cut:false}];for(let i=0;i<6;i++)addPencil();$('score').textContent=0;$('overlay').hidden=true;$('pause').disabled=false;$('pause').textContent='Ⅱ';$('pause').setAttribute('aria-label','暂停');state='playing';$('status').textContent='落点进入铅笔时，点击翻刀';$('toast').classList.remove('show');tone(390,.08);}
function addPencil(){const prev=pencils[pencils.length-1],n=pencils.length+cuts;const gap=194+Math.random()*48;pencils.push({x:prev.x+gap,w:Math.max(48,72-n*1.15),color:colors[n%colors.length],cut:false})}
function start(){ensureAudio();if(state==='paused'){state='playing';$('overlay').hidden=true;$('pause').textContent='Ⅱ';$('pause').setAttribute('aria-label','暂停');$('status').textContent='继续切割';return}reset()}
function flip(){if(state!=='playing'||jump)return;ensureAudio();jump={startX:x,t:0,speed};tone(300,.22,'sine',.025,380);$('status').textContent='翻转中…';}
function showToast(message){$('toast').textContent=message;$('toast').classList.add('show');toastTimer=1.2;}
function end(reason){state='over';$('pause').disabled=true;$('overlay').hidden=false;$('overlayMark').textContent=cuts?'NICE CUTS. ONE MORE?':'TIMING IS EVERYTHING';$('overlayTitle').textContent=cuts?'再来一刀？':'差一点点';$('result').textContent=score;$('overlayText').innerHTML=reason+'<br>已切断 '+cuts+' 支铅笔 · 最佳纪录 '+best+' 分';$('start').textContent='再来一局 →';$('status').textContent='本局结束';tone(170,.26,'triangle',.05,-90);}
function pause(){if(state==='paused'){start();return}if(state!=='playing')return;state='paused';$('overlay').hidden=false;$('overlayMark').textContent='TAKE A BREATH';$('overlayTitle').textContent='稍停一下';$('result').textContent='';$('overlayText').innerHTML='铅笔和刀都在等你。<br>准备好后，继续这一刀。';$('start').textContent='继续游戏 →';$('pause').textContent='▶';$('pause').setAttribute('aria-label','继续');$('status').textContent='已暂停';}
function cut(p){p.cut=true;cuts++;const distance=Math.abs(x-p.x),perfect=distance<=9;combo=perfect?combo+1:0;const gain=perfect?30+Math.min(combo-1,5)*5:10;score+=gain;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('jam-knife-best-v1',best)}catch{}}const left=p.x-p.w/2,right=p.x+p.w/2;debris.push({x:(left+x)/2,y:FLOOR-9,w:x-left,vx:-75-Math.random()*35,vy:-75,rot:0,vr:-2.3,color:p.color,life:1.4},{x:(right+x)/2,y:FLOOR-9,w:right-x,vx:80+Math.random()*35,vy:-90,rot:0,vr:2.8,color:p.color,life:1.4});for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,v=40+Math.random()*170;sparks.push({x,y:FLOOR-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v-70,life:.3+Math.random()*.5,max:.8,color:i%3?p.color:'#f4d9aa',r:1+Math.random()*3})}labels.push({x,y:FLOOR-68,text:'+'+gain,life:1});shake=perfect?5:2;flash=perfect?.17:.06;justCut=.15;showToast(perfect?(combo>1?'PERFECT ×'+combo:'PERFECT!'):'CLEAN CUT');tone(perfect?840:590,.09,'triangle',.07,perfect?350:200);setTimeout(()=>{if(state==='playing')tone(perfect?1240:870,.10,'sine',.04)},45);speed=Math.min(172,100+cuts*4);$('status').textContent=perfect?'正中目标！连击可获得更多分数':'切得漂亮，试试瞄准中线';addPencil();}
function update(dt){elapsed+=dt;if(state!=='playing')return;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}shake=Math.max(0,shake-dt*22);flash=Math.max(0,flash-dt);justCut=Math.max(0,justCut-dt);
if(jump){jump.t+=dt;x=jump.startX+jump.speed*Math.min(jump.t,FLIGHT);if(jump.t>=FLIGHT){const hit=pencils.find(p=>!p.cut&&Math.abs(x-p.x)<=p.w/2-2);jump=null;if(hit)cut(hit);else{end('落点偏了：让虚线圆点进入铅笔范围再起跳。');return}}}else{x+=speed*dt;const pending=pencils.find(p=>!p.cut);if(pending&&x>pending.x-pending.w/2-5){end('起跳晚了：看到预测落点对准铅笔，就可以出刀。');return}}
camera=Math.max(0,x-112);pencils=pencils.filter(p=>p.x>camera-100||!p.cut);for(const d of debris){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=420*dt;d.rot+=d.vr*dt;d.life-=dt}debris=debris.filter(d=>d.life>0);for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;s.life-=dt}sparks=sparks.filter(s=>s.life>0);for(const l of labels){l.y-=36*dt;l.life-=dt}labels=labels.filter(l=>l.life>0);}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function pencil(px,w,color,rot=0,py=FLOOR-10){ctx.save();ctx.translate(px,py);ctx.rotate(rot);rounded(-w/2,-7,w,14,3,color);ctx.fillStyle='#ffffff40';ctx.fillRect(-w/2+3,-5,Math.max(0,w-6),2);ctx.fillStyle='#00000022';ctx.fillRect(-w/2+3,3,Math.max(0,w-6),3);ctx.fillStyle='#f1d7ae';ctx.fillRect(-w/2,-5,3,10);ctx.fillStyle='#2b303c';ctx.fillRect(-w/2,-1,3,3);ctx.restore()}
function knife(px,py,rot){ctx.save();ctx.translate(px,py);ctx.rotate(rot);ctx.shadowColor='#0005';ctx.shadowBlur=12;ctx.shadowOffsetY=4;rounded(-8,-55,16,40,5,'#30394b','#566178');ctx.shadowBlur=0;ctx.shadowOffsetY=0;for(let i=0;i<3;i++){ctx.fillStyle='#7b8aa0';ctx.beginPath();ctx.arc(0,-46+i*10,1.7,0,Math.PI*2);ctx.fill()}rounded(-12,-18,24,5,2,'#d9ff68');const grad=ctx.createLinearGradient(-9,0,11,0);grad.addColorStop(0,'#8f9eb3');grad.addColorStop(.45,'#f4fbff');grad.addColorStop(.58,'#ccd5e3');grad.addColorStop(1,'#718197');ctx.beginPath();ctx.moveTo(-7,-13);ctx.lineTo(11,-13);ctx.lineTo(11,28);ctx.quadraticCurveTo(8,43,0,55);ctx.lineTo(-7,18);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='#ffffffa0';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(10,-11);ctx.lineTo(10,26);ctx.lineTo(0,52);ctx.stroke();ctx.restore()}
function draw(){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#171e2a');bg.addColorStop(.72,'#1b2432');bg.addColorStop(1,'#101620');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.strokeStyle='#ffffff05';ctx.lineWidth=1;for(let y=24;y<FLOOR;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let gx=-(camera*.3)%34;gx<W;gx+=34){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,FLOOR);ctx.stroke()}
ctx.fillStyle='#62718a';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='left';ctx.fillText('PRECISION WORKSHOP',22,31);ctx.textAlign='right';ctx.fillText(String(cuts).padStart(2,'0')+' CUTS',W-22,31);
ctx.fillStyle='#111720';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.fillStyle='#333d4c';ctx.fillRect(0,FLOOR,W,4);ctx.fillStyle='#080d15';ctx.fillRect(0,FLOOR+4,W,9);for(let gx=-(camera*.75)%80;gx<W;gx+=80){ctx.strokeStyle='#ffffff04';ctx.beginPath();ctx.moveTo(gx,FLOOR+20);ctx.lineTo(gx-38,H);ctx.stroke()}
for(const p of pencils){if(p.cut)continue;const sx=p.x-camera;if(sx< -100||sx>W+100)continue;ctx.fillStyle='#050a1190';ctx.beginPath();ctx.ellipse(sx,FLOOR-1,p.w*.65,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6f7c8c';ctx.fillRect(sx-p.w*.32,FLOOR-4,5,4);ctx.fillRect(sx+p.w*.32-5,FLOOR-4,5,4);pencil(sx,p.w,p.color);ctx.strokeStyle='#10131b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,FLOOR-18);ctx.lineTo(sx,FLOOR-2);ctx.stroke();ctx.strokeStyle=p.color+'88';ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.beginPath();ctx.moveTo(sx,FLOOR-28);ctx.lineTo(sx,FLOOR-54);ctx.stroke();ctx.setLineDash([]);}
const sx=x-camera,progress=jump?Math.min(1,jump.t/FLIGHT):0,ky=FLOOR-55-(jump?Math.sin(progress*Math.PI)*145:0);if(state==='playing'&&!jump){const lx=sx+speed*FLIGHT;const target=pencils.find(p=>!p.cut),aligned=target&&Math.abs(x+speed*FLIGHT-target.x)<target.w/2-2,perfect=target&&Math.abs(x+speed*FLIGHT-target.x)<=9;ctx.strokeStyle=aligned?'#d9ff6880':'#8d9bb150';ctx.lineWidth=1;ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(sx,FLOOR-70);ctx.quadraticCurveTo(sx+speed*FLIGHT/2,FLOOR-210,lx,FLOOR-23);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle=aligned?'#d9ff68':'#8490a5';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(lx,FLOOR-9,perfect?13:10,perfect?7:5,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle=aligned?'#d9ff68':'#a5afc0';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText(aligned?'现在翻！':'预测落点',lx,FLOOR+33);if(cuts===0){ctx.fillStyle='#abb6c9';ctx.fillText('等圆点进入铅笔，再点击',W/2,113);}}
ctx.globalAlpha=jump?.12+.2*progress:.3;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(sx,FLOOR+1,16+(jump?Math.sin(progress*Math.PI)*7:0),4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;knife(sx,ky,jump?progress*Math.PI*2:0);
for(const d of debris){ctx.globalAlpha=Math.min(1,d.life*2);pencil(d.x-camera,d.w,d.color,d.rot,d.y)}ctx.globalAlpha=1;for(const s of sparks){ctx.globalAlpha=Math.min(1,s.life*2);ctx.fillStyle=s.color;ctx.fillRect(s.x-camera,s.y,s.r,s.r)}ctx.globalAlpha=1;for(const l of labels){ctx.globalAlpha=Math.min(1,l.life*2);ctx.fillStyle='#d9ff68';ctx.font='bold 22px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText(l.text,l.x-camera,l.y)}ctx.globalAlpha=1;ctx.restore();if(flash){ctx.fillStyle='rgba(217,255,104,'+flash*.3+')';ctx.fillRect(0,0,W,H)}if(state==='ready'){ctx.fillStyle='#d9ff6830';ctx.font='bold 90px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('CUT.',W/2,205)}}
function frame(now){const dt=Math.min((now-last)/1000||0,.035);last=now;update(dt);draw();requestAnimationFrame(frame)}
$('start').addEventListener('click',e=>{e.stopPropagation();start()});$('pause').addEventListener('click',pause);$('restart').addEventListener('click',()=>{ensureAudio();reset()});$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♪':'♩';$('sound').style.color=soundOn?'#d6ddeb':'#647085';$('sound').setAttribute('aria-label',soundOn?'关闭音效':'开启音效');if(soundOn){ensureAudio();tone(660,.1)}});$('stage').addEventListener('pointerdown',e=>{if(e.target.closest('button')||state!=='playing')return;e.preventDefault();flip()});window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();if(state==='ready'||state==='over'||state==='paused')start();else flip()}else if(e.code==='KeyP')pause();else if(e.code==='KeyR'){ensureAudio();reset()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});requestAnimationFrame(frame);
})();
</script>
</body>
</html>
